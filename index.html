<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Audio Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:radial-gradient(circle at center,#1e1f29 0%,#0f1015 100%);}
.eq-bar{animation:bounce 1.2s ease-in-out infinite alternate;}
.eq-bar:nth-child(odd){animation-delay:0.2s;}
.eq-bar:nth-child(even){animation-delay:0.5s;}
.eq-bar:nth-child(3n){animation-delay:0.1s;}
@keyframes bounce{0%{height:10%;opacity:0.2;}100%{height:90%;opacity:0.6;}}
.glow-card{box-shadow:0 0 30px rgba(88,101,242,0.15),0 10px 25px rgba(0,0,0,0.5);}
.btn-pulse{animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,101,242,0.6);}70%{box-shadow:0 0 0 14px rgba(88,101,242,0);}100%{box-shadow:0 0 0 0 rgba(88,101,242,0);}}
</style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">
<div class="glow-card w-full max-w-sm bg-[#2b2d31]/90 backdrop-blur-md rounded-2xl border border-white/10 p-6 flex flex-col items-center relative overflow-hidden transition-all duration-300">
<div id="bgEqualizer" class="absolute inset-0 flex items-end justify-between px-4 opacity-0 transition-opacity duration-500 pointer-events-none z-0">
<div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div><div class="eq-bar w-[6%] bg-indigo-500/30 rounded-t-full"></div>
</div>
<div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none z-0"></div>
<div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl pointer-events-none z-0"></div>
<div class="relative z-10 flex flex-col items-center w-full">
<div class="relative w-36 h-36 mb-6 rounded-xl overflow-hidden shadow-lg group border border-white/10 bg-[#1e1f29]">
<img id="coverImg" src="im4ge.png" alt="Audio Cover" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/400x400/2b2d31/ffffff?text=im4ge.png'">
</div>
<h1 class="text-xl font-bold tracking-tight text-white mb-1 text-center">audio.mp3</h1>
<p class="text-xs font-medium text-slate-400 mb-2 text-center flex items-center justify-center gap-1.5"><i class="fa-brands fa-discord text-indigo-400 text-sm"></i><span>Discord Audio Player</span></p>
<button id="playBtn" class="btn-pulse w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 flex items-center justify-center gap-2.5 shadow-lg shadow-indigo-600/30"><i id="btnIcon" class="fa-solid fa-play text-sm"></i><span id="btnText">Play Audio</span></button>
<p id="statusText" class="text-xs text-slate-500 mt-4 text-center transition-all duration-300 min-h-[1rem]">Click anywhere to play audio</p>
</div>
</div>
<audio id="audioElement" src="audio.mp3" preload="auto"></audio>
<script>
const playBtn=document.getElementById('playBtn'),btnIcon=document.getElementById('btnIcon'),btnText=document.getElementById('btnText'),statusText=document.getElementById('statusText'),bgEqualizer=document.getElementById('bgEqualizer'),audioElement=document.getElementById('audioElement');
let isPlaying=false;
async function handlePlay(){
try{audioElement.currentTime=0;await audioElement.play();isPlaying=true;
playBtn.classList.remove('btn-pulse','bg-indigo-600','hover:bg-indigo-500');
playBtn.classList.add('bg-emerald-600','hover:bg-emerald-500');
btnIcon.className="fa-solid fa-volume-high text-sm animate-pulse";
btnText.innerText="Now Playing";
bgEqualizer.classList.remove('opacity-0');
bgEqualizer.classList.add('opacity-100');
statusText.innerText="Now Playing";
}catch(err){console.error(err);statusText.innerText="Error loading.";}
}
audioElement.addEventListener('ended',()=>{
isPlaying=false;
playBtn.classList.add('btn-pulse','bg-indigo-600','hover:bg-indigo-500');
playBtn.classList.remove('bg-emerald-600','hover:bg-emerald-500');
btnIcon.className="fa-solid fa-play text-sm";
btnText.innerText="Play Audio";
bgEqualizer.classList.remove('opacity-100');
bgEqualizer.classList.add('opacity-0');
statusText.innerText="Finished. Click to play again.";
});
playBtn.addEventListener('click',(e)=>{e.stopPropagation();handlePlay();});
document.body.addEventListener('click',()=>{if(!isPlaying)handlePlay();});
</script>
</body>
</html>
