<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shibarakiri.mp3 - Discord Audio Player</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at center, #1e1f29 0%, #0f1015 100%);
    }

    /* Equalizer animation */
    .eq-bar {
      animation: bounce 1.2s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes bounce {
      0% { height: 6px; }
      100% { height: 28px; }
    }

    /* Subtle glowing card effect */
    .glow-card {
      box-shadow: 0 0 30px rgba(88, 101, 242, 0.15), 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Pulse animation for the play button */
    .btn-pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0.6); }
      70% { box-shadow: 0 0 0 14px rgba(88, 101, 242, 0); }
      100% { box-shadow: 0 0 0 0 rgba(88, 101, 242, 0); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <!-- Main Glassmorphism Player Card -->
  <div class="glow-card w-full max-w-sm bg-[#2b2d31]/90 backdrop-blur-md rounded-2xl border border-white/10 p-6 flex flex-col items-center relative overflow-hidden transition-all duration-300">
    
    <!-- Decorative Ambient Glow -->
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Album Art / Cover Placeholder -->
    <div class="relative w-36 h-36 mb-6 rounded-xl overflow-hidden shadow-lg group border border-white/10">
      <img 
        id="coverImg"
        src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop" 
        alt="Audio Cover" 
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        onerror="this.src='https://placehold.co/400x400/2b2d31/ffffff?text=Shibarakiri'"
      >
      <!-- Equalizer Overlay (Hidden until playing) -->
      <div id="eqOverlay" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] flex items-center justify-center gap-1.5 opacity-0 transition-opacity duration-300">
        <div class="eq-bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
        <div class="eq-bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
        <div class="eq-bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
        <div class="eq-bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
      </div>
    </div>

    <!-- Heading Title -->
    <h1 class="text-xl font-bold tracking-tight text-white mb-1 text-center">🎵 Shibarakiri.mp3</h1>
    
    <!-- Label -->
    <p class="text-xs font-medium text-slate-400 mb-2 text-center flex items-center justify-center gap-1.5">
      <i class="fa-brands fa-discord text-indigo-400 text-sm"></i>
      <span>Discord Audio Player</span>
    </p>

    <!-- Description Text -->
    <p class="text-xs text-slate-300 mb-6 text-center">
      Click below to listen to the audio.
    </p>

    <!-- Main Interactive Play Button -->
    <button 
      id="playBtn" 
      class="btn-pulse w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 flex items-center justify-center gap-2.5 shadow-lg shadow-indigo-600/30"
    >
      <i id="btnIcon" class="fa-solid fa-play text-sm"></i>
      <span id="btnText">Play Audio</span>
    </button>

    <!-- Status Note -->
    <p id="statusText" class="text-xs text-slate-500 mt-4 text-center transition-all duration-300 min-h-[1rem]">
      Click anywhere to play audio
    </p>

  </div>

  <!-- Audio Element -->
  <audio id="audioElement" src="Shibarakiri.mp3" preload="auto" loop></audio>

  <script>
    const playBtn = document.getElementById('playBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const statusText = document.getElementById('statusText');
    const eqOverlay = document.getElementById('eqOverlay');
    const audioElement = document.getElementById('audioElement');

    let isPlaying = false;

    async function handlePlay() {
      if (isPlaying) return;

      try {
        await audioElement.play();
        isPlaying = true;

        // UI Updates
        playBtn.classList.remove('btn-pulse', 'bg-indigo-600', 'hover:bg-indigo-500');
        playBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
        btnIcon.className = "fa-solid fa-volume-high text-sm animate-pulse";
        btnText.innerText = "Now Playing 🎵";
        eqOverlay.classList.remove('opacity-0');
        eqOverlay.classList.add('opacity-100');
        statusText.innerText = "Playing Shibarakiri.mp3 loop. Click to pause/resume.";

      } catch (err) {
        console.error("Audio playback error:", err);
        statusText.innerText = "Error loading Shibarakiri.mp3. Check your filename.";
      }
    }

    // Trigger on main button click
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isPlaying) {
        handlePlay();
      } else {
        // Toggle pause/play
        if (audioElement.paused) {
          audioElement.play();
          btnText.innerText = "Now Playing 🎵";
          eqOverlay.classList.replace('opacity-0', 'opacity-100');
        } else {
          audioElement.pause();
          btnText.innerText = "Paused";
          eqOverlay.classList.replace('opacity-100', 'opacity-0');
        }
      }
    });

    // Also trigger play if user clicks anywhere on the page
    document.body.addEventListener('click', () => {
      if (!isPlaying) {
        handlePlay();
      }
    });
  </script>
</body>
</html>
